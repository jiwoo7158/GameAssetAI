[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameassetai"
dynamic = ["version"]
description = "Product foundation for an installable, style-driven game asset workflow"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
gameassetai = "gameassetai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "gameassetai.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
