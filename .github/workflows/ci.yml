name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-foundation:
    name: Python 3.10 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out tracked repository files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Validate repository and tracked Skills
        run: python -B scripts/validate_repo.py

      - name: Run offline product and retained-contract tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Build and validate the Workspace distribution without publishing
        run: >-
          python -B scripts/gameassetai.py package build-workspace-dist .
          "${{ runner.temp }}/gameassetai-workspace-dist"
          --source-commit "${{ github.sha }}"

      - name: Validate the generated Workspace distribution
        run: >-
          python -B scripts/gameassetai.py package validate-workspace-dist
          "${{ runner.temp }}/gameassetai-workspace-dist"
